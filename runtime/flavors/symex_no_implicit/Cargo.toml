[package]
name = "runtime_symex_no_implicit"
license = { workspace = true }
version = { workspace = true }
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "leafrt_symex_no_implicit"
crate-type = ["cdylib"]
test = false

[dependencies]
common = { workspace = true }
backend = { path = "../../backends/symex", package = "runtime_backend_symex", features = [
    "runtime_access_raw_ptr",
    "release_value_loss_checks",
] }

[features]
run_sample_sanity_tests = ["common/testing"]

[[test]]
name = "sample_sanity"
path = "../sample_sanity_tests.rs"
required-features = ["run_sample_sanity_tests"]

[dev-dependencies]
macros = { workspace = true }

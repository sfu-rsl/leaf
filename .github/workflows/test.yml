name: Test

on:
  push:
    branches: [main]
  pull_request: # Every target branch

env:
  RUST_LOG: error

jobs:
  mdbook-test:
    name: Build book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-book

  rust-test:
    name: Run tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    env:
      LEAF_TEST_RUNTIME: ${{ github.workspace }}/target/debug/${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: noop
            artifact: libleafrt_noop.so
          - backend: cf_tracer
            artifact: libleafrt_cf_tracer.so
          - backend: mdsan
            artifact: libleafrt_mdsan.so
          - backend: symex
            artifact: libleafrt_symex.so
          - backend: symex_no_implicit
            artifact: libleafrt_symex_no_implicit.so
    steps:
      - uses: actions/checkout@v2

      - uses: Swatinem/rust-cache@v2

      - name: Prerequisite - Souffle
        run: |
          # Define the version you want to install
          SOUFFLE_VERSION="2.5"  # Change this to the desired version
          wget "https://github.com/souffle-lang/souffle/releases/download/${SOUFFLE_VERSION}/x86_64-ubuntu-2404-souffle-${SOUFFLE_VERSION}-Linux.deb"
          sudo apt-get update
          sudo dpkg -i "x86_64-ubuntu-2404-souffle-${SOUFFLE_VERSION}-Linux.deb" || sudo apt-get install -f

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

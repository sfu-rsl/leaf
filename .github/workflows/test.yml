name: Test

on:
  push:
    branches: [main]
  pull_request: # Every target branch

env:
  RUST_LOG: error

jobs:
  mdbook-test:
    name: Build book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-book

  build:
    name: Build workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Build workspace
        run: cargo build --workspace --verbose

  compiler-test:
    name: Run compiler tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v2

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Run compiler tests
        run: cargo test --verbose -p compiler

  rust-test:
    name: Run tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    needs: build
    env:
      LEAFC: ${{ github.workspace }}/target/debug/leafc
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cf_tracer
          - backend: mdsan
          - backend: symex
          - backend: symex_no_implicit
    steps:
      - uses: actions/checkout@v2

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Build compiler and runtime backends
        run: cargo build --verbose -p compiler -p runtime_${{ matrix.backend }}

      - name: Run sample sanity tests for backends
        run: cargo test --verbose -p runtime_${{ matrix.backend }} --no-default-features --features run_sample_sanity_tests --test sample_sanity
